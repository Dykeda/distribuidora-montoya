{% extends "base.html" %}
{% block title %}Registrar compra{% endblock %}
{% block content %}
<h1 class="h3 mb-3">Registrar compra</h1>

{% if not productos %}
<div class="alert alert-warning">No hay productos activos todavía. <a href="{{ url_for('productos.nuevo') }}">Crea un producto primero</a>.</div>
{% endif %}

<form method="post">
  <div class="row col-lg-8 mb-3">
    <div class="col-md-4">
      <label class="form-label">Fecha</label>
      <input type="date" name="fecha" class="form-control" value="{{ form.fecha if form else '' }}" required>
    </div>
    <div class="col-md-4">
      <label class="form-label">N° Factura (opcional)</label>
      <input type="text" name="numero_factura" class="form-control" value="{{ form.numero_factura if form else '' }}">
    </div>
    <div class="col-md-4">
      <label class="form-label">Notas (opcional)</label>
      <input type="text" name="notas" class="form-control" value="{{ form.notas if form else '' }}">
    </div>
  </div>

  <div class="table-responsive">
  <table class="table" id="tabla-lineas">
    <thead>
      <tr>
        <th>Producto</th>
        <th style="width:110px">Cantidad</th>
        <th style="width:110px">En</th>
        <th style="width:140px">Costo ($)</th>
        <th style="width:110px">Descuento %</th>
        <th></th>
      </tr>
    </thead>
    <tbody id="cuerpo-lineas"></tbody>
  </table>
  </div>
  <button type="button" id="btn-agregar-linea" class="btn btn-outline-secondary btn-sm mb-3">+ Agregar producto</button>
  <br>
  <button type="submit" class="btn btn-primary">Guardar compra</button>
  <a href="{{ url_for('compras.listar') }}" class="btn btn-link">Cancelar</a>
</form>

<template id="plantilla-linea">
  <tr>
    <td>
      <select name="producto_id[]" class="form-select" required>
        <option value="">-- elegir --</option>
        {% for p in productos %}
        <option value="{{ p.id }}" data-tasa="{{ p.tasa_descuento_referencia }}">{{ p.nombre }}</option>
        {% endfor %}
      </select>
    </td>
    <td><input type="number" step="0.01" min="0" name="cantidad[]" class="form-control" required></td>
    <td>
      <select name="tipo_cantidad[]" class="form-select">
        <option value="caja">Cajas</option>
        <option value="unidad">Unidades</option>
      </select>
    </td>
    <td><input type="number" min="0" name="costo_linea[]" class="form-control" required></td>
    <td><input type="number" step="0.1" min="0" name="tasa_descuento[]" class="form-control" value="0"></td>
    <td><button type="button" class="btn btn-sm btn-outline-danger btn-quitar-linea">&times;</button></td>
  </tr>
</template>

<script>
  const cuerpo = document.getElementById("cuerpo-lineas");
  const plantilla = document.getElementById("plantilla-linea");

  function agregarLinea() {
    const nodo = plantilla.content.cloneNode(true);
    nodo.querySelector(".btn-quitar-linea").addEventListener("click", (e) => {
      e.target.closest("tr").remove();
    });
    nodo.querySelector('select[name="producto_id[]"]').addEventListener("change", (e) => {
      const opcion = e.target.selectedOptions[0];
      const tasaInput = e.target.closest("tr").querySelector('input[name="tasa_descuento[]"]');
      tasaInput.value = opcion ? (opcion.dataset.tasa || 0) : 0;
    });
    cuerpo.appendChild(nodo);
  }

  document.getElementById("btn-agregar-linea").addEventListener("click", agregarLinea);
  agregarLinea(); // arranca con una línea vacía
</script>
{% endblock %}
