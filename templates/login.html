<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ingresar — Distribuidora Montoya</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link href="{{ url_for('static', filename='css/estilos.css') }}" rel="stylesheet">
</head>
<body class="d-flex align-items-center" style="min-height: 100vh;">
  <div class="container" style="max-width: 380px;">
    <div class="text-center mb-4">
      <div style="font-size: 2.5rem;">🥤</div>
      <h1 class="h4 fw-bold">Distribuidora Montoya</h1>
    </div>

    {% with mensajes = get_flashed_messages(with_categories=true) %}
      {% if mensajes %}
        {% for categoria, mensaje in mensajes %}
          <div class="alert alert-{{ 'danger' if categoria == 'error' else categoria }}" role="alert">{{ mensaje }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <div class="card">
      <div class="card-body p-4">
        <form method="post">
          <label class="form-label">Contraseña</label>
          <input type="password" name="password" class="form-control mb-3" autofocus required>
          <button type="submit" class="btn btn-primary w-100">Ingresar</button>
        </form>
      </div>
    </div>
  </div>
</body>
</html>
